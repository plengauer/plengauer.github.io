name: CI

on:
  push:
    branches: main
    paths:
      - 'VERSION'

jobs:

  release:
    runs-on: ubuntu-slim
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - run: |
          GH_TOKEN=${{ secrets.ACTIONS_GITHUB_TOKEN || github.token }} gh release create v"$(cat VERSION)" --title v"$(cat VERSION)" --target ${{ github.sha }} --generate-notes
