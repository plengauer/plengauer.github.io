name: Rollout Template Updates

on:
  push:
    branches:
      - main
    paths:
      - .github/template/**/*.yml
      - .github/template/**/*.md

concurrency:
  group: rollout-template-updates-${{ github.sha }}

jobs:

  prepare:
    runs-on: ubuntu-slim
    outputs:
      repositories: ${{ steps.repos.outputs.repositories }}
      commits: ${{ steps.commits.outputs.commits }}
    steps:
      - uses: plengauer/opentelemetry-github/actions/instrument/job@af83be0ddf1ec3035230c030f3ab6d10a7040515 # v5.56.0
        env:
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT }}
          OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}
        with:
          secrets_to_redact: |-
            ${{ github.token }}
            ${{ secrets.BOT_GITHUB_TOKEN }}
      - id: repos
        env:
          GH_TOKEN: ${{ secrets.BOT_GITHUB_TOKEN }}
        run: |
          gh api /users/${{ github.repository_owner }}/repos --paginate | jq '.[] | select(.fork == false and .visibility == "public" and .owner.login == "${{ github.repository_owner }}") | .name' -r \
            | sort -R | head -n 256 | jq -R | jq '"${{ github.repository_owner }}/" + .' | jq -cs | xargs -0 -I {} echo 'repositories={}' >> "$GITHUB_OUTPUT"
      - id: commits
        env:
          COMMITS_JSON: ${{ toJSON(github.event.commits) }}
        run: |
          echo "$COMMITS_JSON" | jq '[.[].id]' -c | xargs -0 -I {} echo 'commits={}' >> "$GITHUB_OUTPUT"
    permissions:
      actions: read

  rollout:
    needs: prepare
    runs-on: ubuntu-slim
    strategy:
      matrix:
        repository: ${{ fromJSON(needs.prepare.outputs.repositories) }}
        sha: ${{ fromJSON(needs.prepare.outputs.commits) }}
      fail-fast: false
    steps:
      - uses: plengauer/opentelemetry-github/actions/instrument/job@af83be0ddf1ec3035230c030f3ab6d10a7040515 # v5.56.0
        env:
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT }}
          OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}
        with:
          secrets_to_redact: |-
            ${{ github.token }}
            ${{ secrets.BOT_GITHUB_TOKEN }}
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          token: ${{ secrets.BOT_GITHUB_TOKEN }}
          fetch-depth: 0
          path: ./self
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          token: ${{ secrets.BOT_GITHUB_TOKEN }}
          path: ./other
          repository: ${{ matrix.repository }}
      - id: diff
        run: |
          cd ./self
          git diff "${{ matrix.sha }}^1" "${{ matrix.sha }}" -- '.github/template/**/*.yml' \
            | sed 's|\.github/template/[^/]*/||g' > /tmp/template.patch
          [ -s /tmp/template.patch ] && echo "has_changes=true" >> "$GITHUB_OUTPUT" || true
      - id: apply
        if: steps.diff.outputs.has_changes == 'true'
        run: |
          cd ./other
          if git apply --check /tmp/template.patch 2>/dev/null; then
            git apply /tmp/template.patch
            echo "applicable=true" >> "$GITHUB_OUTPUT"
          else
            echo "applicable=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.apply.outputs.applicable == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        id: open-pr
        with:
          token: ${{ secrets.BOT_GITHUB_TOKEN }}
          path: ./other
          commit-message: "Apply template updates from ${{ github.repository }}@${{ matrix.sha }}"
          branch: "automate-rollout-${{ matrix.sha }}"
          title: "Apply template updates from ${{ matrix.sha }}"
          body: |
            Template workflows have been updated in [${{ github.repository }}](${{ github.server_url }}/${{ github.repository }}).

            This PR applies the changes from commit [${{ matrix.sha }}](${{ github.server_url }}/${{ github.repository }}/commit/${{ matrix.sha }}).
          delete-branch: true
      - if: steps.open-pr.outputs.pull-request-number != null
        shell: bash
        run: sleep 60
      - if: steps.open-pr.outputs.pull-request-number != null
        shell: bash
        run: gh pr merge --squash --auto ${{ steps.open-pr.outputs.pull-request-number }}
        env:
          GH_TOKEN: ${{ secrets.BOT_GITHUB_TOKEN }}
        continue-on-error: true
      - if: steps.apply.outputs.applicable == 'false'
        env:
          GH_TOKEN: ${{ secrets.BOT_GITHUB_TOKEN }}
        run: |
          commit_message=$(cd ./self && git log --format="%B" -n 1 "${{ matrix.sha }}")
          {
            printf "Template workflows have been updated but the diff could not be automatically applied to this repository.\n\n"
            printf "## Commit\n\n"
            printf "%s\n\n" "$commit_message"
            printf "See: ${{ github.server_url }}/${{ github.repository }}/commit/${{ matrix.sha }}\n\n"
            printf "## Diff\n\n\`\`\`diff\n"
            cat /tmp/template.patch
            printf "\n\`\`\`\n"
          } > /tmp/issue_body.md
          gh issue create \
            --repo "${{ matrix.repository }}" \
            --title "Template update requires manual application (${{ matrix.sha }})" \
            --body-file /tmp/issue_body.md
    permissions:
      actions: read
